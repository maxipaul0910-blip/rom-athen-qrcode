<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#70c5ce;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    margin:auto;
    background:linear-gradient(#70c5ce,#cceeff);
    touch-action:none;
}

#score{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    font-size:32px;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}

#message{
    position:absolute;
    width:100%;
    top:50%;
    transform:translateY(-50%);
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
}
</style>
</head>
<body>

<div id="score">0</div>
<div id="message">Tippen/Klicken oder Leertaste drücken</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let bird;
let pipes;
let score;
let started;
let gameOver;

function resetGame(){
    bird = {
        x: canvas.width * 0.25,
        y: canvas.height / 2,
        radius: 20,
        velocity: 0
    };

    pipes = [];
    score = 0;
    started = false;
    gameOver = false;

    document.getElementById("score").textContent = score;
    document.getElementById("message").textContent =
        "Tippen/Klicken oder Leertaste drücken";
}

resetGame();

const gravity = 0.55;
const jumpPower = -10;
const pipeWidth = 80;
const gap = 180;
const pipeSpeed = 4;

function flap(){
    if(gameOver){
        resetGame();
        return;
    }

    started = true;
    document.getElementById("message").textContent = "";
    bird.velocity = jumpPower;
}

window.addEventListener("keydown", e=>{
    if(e.code === "Space"){
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener("mousedown", flap);
canvas.addEventListener("touchstart", e=>{
    e.preventDefault();
    flap();
});

function spawnPipe(){
    let topHeight =
        Math.random() * (canvas.height - gap - 200) + 50;

    pipes.push({
        x: canvas.width,
        top: topHeight,
        counted: false
    });
}

setInterval(()=>{
    if(started && !gameOver){
        spawnPipe();
    }
}, 1800);

function update(){

    if(!started || gameOver) return;

    bird.velocity += gravity;
    bird.y += bird.velocity;

    if(
        bird.y + bird.radius > canvas.height ||
        bird.y - bird.radius < 0
    ){
        endGame();
    }

    for(let i=pipes.length-1;i>=0;i--){

        let p = pipes[i];
        p.x -= pipeSpeed;

        if(
            bird.x + bird.radius > p.x &&
            bird.x - bird.radius < p.x + pipeWidth
        ){
            if(
                bird.y - bird.radius < p.top ||
                bird.y + bird.radius > p.top + gap
            ){
                endGame();
            }
        }

        if(!p.counted && bird.x > p.x + pipeWidth){
            p.counted = true;
            score++;
            document.getElementById("score").textContent = score;
        }

        if(p.x + pipeWidth < 0){
            pipes.splice(i,1);
        }
    }
}

function endGame(){
    gameOver = true;
    document.getElementById("message").innerHTML =
        "Game Over<br>Score: " + score +
        "<br>Tippen/Klicken zum Neustart";
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Boden
    ctx.fillStyle="#d8c38d";
    ctx.fillRect(
        0,
        canvas.height-40,
        canvas.width,
        40
    );

    // Rohre
    ctx.fillStyle="#2ecc71";

    pipes.forEach(p=>{

        ctx.fillRect(
            p.x,
            0,
            pipeWidth,
            p.top
        );

        ctx.fillRect(
            p.x,
            p.top + gap,
            pipeWidth,
            canvas.height
        );
    });

    // Vogel
    ctx.fillStyle="yellow";

    ctx.beginPath();
    ctx.arc(
        bird.x,
        bird.y,
        bird.radius,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Auge
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(
        bird.x + 8,
        bird.y - 5,
        5,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(
        bird.x + 10,
        bird.y - 5,
        2,
        0,
        Math.PI * 2
    );
    ctx.fill();
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
